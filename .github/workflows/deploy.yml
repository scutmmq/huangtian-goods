name: Production CI/CD Pipeline

# 触发条件：当 master 分支有 push 时触发，或者支持手动在网页上点按钮触发
on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch: # 允许在 GitHub 网页 Actions 界面手动一键触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 安装并配置 Java 17 环境 (开启 maven 依赖缓存，加速后续构建)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. 准备生产环境 .env (assembly 打包时强依赖该文件)
      - name: Prepare Production .env
        run: |
          echo "${{ secrets.PROD_ENV }}" > .env
          chmod 600 .env

      # 4. Maven 编译打包
      - name: Build Release Package with Maven
        run: |
          mvn clean package -DskipTests
          ls -lh target/huangtian-goods-release.tar.gz

      # 5. 通过 SCP 将 tar.gz 发送至远程服务器
      - name: Upload Release to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "target/huangtian-goods-release.tar.gz"
          target: "/root/DockerFile/online-mall/back"
          strip_components: 1 # 去除 target/ 前缀，直接存放在 back 目录下
          overwrite: true

      # 6. 通过 SSH 远程触发解压与 Docker 部署
      - name: Execute Remote Deploy Script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            cd /root/DockerFile/online-mall/back
            
            echo "====> [1/3] 解压新发布包..."
            # 备份老目录
            if [ -d "./huangtian-goods" ]; then
              rm -rf ./huangtian-goods.bak
              mv ./huangtian-goods ./huangtian-goods.bak
            fi
            
            tar -zxf ./huangtian-goods-release.tar.gz
            
            echo "====> [2/3] 执行容器构建与重启..."
            cd ./huangtian-goods
            ./run.sh prd
            
            echo "====> [3/3] 自动化健康检查..."
            SUCCESS=0
            for i in $(seq 1 15); do
              echo "正在探活服务 (第 \$i 次尝试)..."
              STATUS_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
              if [[ "$STATUS_CODE" =~ ^(200|401|403|404)$ ]]; then
                echo "✅ 服务已成功启动！HTTP 响应码: \$STATUS_CODE"
                SUCCESS=1
                break
              fi
              sleep 2
            done
            
            if [ \$SUCCESS -ne 1 ]; then
              echo "❌ 容器启动超时或异常，最新日志如下："
              docker logs --tail 50 online-mall-backend
              exit 1
            fi
            
            echo "🎉 部署完成！查看容器状态："
            docker ps --filter "name=online-mall-backend"