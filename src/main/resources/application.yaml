spring:
  aop:
    proxy-target-class: true
  application:
    name: online-mall-application
  profiles:
    active: dev

server:
  port: 8080

mybatis-plus:
  mapper-locations: classpath*:com/scutmmq/mapper/**/*.xml
  type-aliases-package: com.scutmmq.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.CompositeEnumTypeHandler
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketName: web-management-ai
    region: cn-beijing

ai:
  api:
    key: "${AI_API_KEY:}"
    url: "${AI_API_URL:https://api.deepseek.com/chat/completions}"
    model: "${AI_API_MODEL:deepseek-chat}"
    auth-header: "${AI_API_AUTH_HEADER:Authorization}"
    auth-scheme: "${AI_API_AUTH_SCHEME:Bearer}"
  assistant:
    max-history-messages: 20
    draft-expire-minutes: 15
  # B2:AI 助手能力开关。默认全部禁用,改 yaml 启用。
  # 见 strategy 文档 §B2 Checkpoint 3。
  capability:
    flags:
      observability: false    # 启用后:Run 用量落 ai_run_usage + 延迟日志
      eval: false             # 启用后:启用 EvalRunner(/dev/ai/eval/run)
      rag: false              # B4 启用后:启用 RAG 知识库与规则问答系统
  observability:
    cost-per-1k-prompt-tokens: 0
    cost-per-1k-completion-tokens: 0
  # B3:长期记忆 — step0 注入配置块,后续 step 逐步绑定
  memory:
    cache-hmac-secrets: "v1:dev-only-fallback-please-set-via-env-in-production-min-32-chars"
    active-secret-version: v1
    coalesce-ttl-seconds: 60
    recompute-cron: "0 0 3 * * ?"
    partition-drop-cron: "0 0 2 1 * ?"
    prompt-token-cap: 600
    recompute-batch-size: 1000
    recompute-max-fail-count: 3
    reset-retention-days: 180
    audit-partition-retention-days: 90
    audit-purge-rate-rows-per-sec: 100
    local-rate-limit-per-user: 1
    local-rate-limit-burst: 200
  # B4:RAG 知识库与规则问答系统配置
  rag:
    enabled: false
    embedding-provider: "${AI_EMBEDDING_PROVIDER:dashscope}"
    embedding-url: "${AI_EMBEDDING_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings}"
    embedding-api-key: "${AI_EMBEDDING_API_KEY:}"
    embedding-model: "${AI_EMBEDDING_MODEL:text-embedding-v3}"
    embedding-dimension: 1024
    top-k: 3
    min-score: 0.65
    ingest-cron: "0 0 4 * * ?"
    cache-ttl-hours: 24
    rate-limit-per-second: 20

# B3 step0:Prometheus 指标端点(供后续 AI 长期记忆指标上报使用)
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    prometheus:
      access: read_only
  metrics:
    tags:
      application: ${spring.application.name}
